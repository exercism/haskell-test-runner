name: setup-tests
version: 1.0.0.0

dependencies:
  - base

executables:
  setup-tests:
    main: Main.hs
    source-dirs: src
    ghc-options: -Wall
    dependencies:
      - aeson
      - directory
      - lens
      - lens-aeson
      - yaml

  # Prints the unit id Cabal gives a package's library, for bin/fast-run.sh.
  cabal-unit-id:
    main: CabalUnitId.hs
    source-dirs: unit-id
    ghc-options: -Wall
    dependencies:
      - Cabal
